# The strategy exactly as first built, kept for comparison:
#   python bot.py --backtest --config config_original.toml
# The only differences from config.toml are entry_order and flatten_before_close.

[market]
symbol = "SKHY"
interval = "15m"
lookback_days = 60

[indicators]
ema_period = 200
bb_period = 20
bb_std = 2.0
atr_period = 14

[risk]
risk_per_trade_pct = 0.25
stop_atr_multiple = 1.5
max_position_pct = 50.0

[execution]
entry_order = "market"         # original: buy at once at the market price
flatten_before_close = false   # original: positions held overnight until the stop or target is hit
time_in_force = "gtc"

[backtest]
slippage_pct = 0.05
